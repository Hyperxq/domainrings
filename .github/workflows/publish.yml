name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # npm reads this itself, so `npm view` and `npm publish` need no --registry flag.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require manual dispatch from the canonical repository on main
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REPOSITORY" != "Hyperxq/domainrings" ] || [ "$EVENT" != "workflow_dispatch" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "Publication requires manual dispatch from the canonical repository on main." >&2
            exit 1
          fi

  verify:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: ${{ env.NPM_CONFIG_REGISTRY }}

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: publish-pbuilder-domainrings
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: ${{ env.NPM_CONFIG_REGISTRY }}

      - name: Require npm with trusted publishing
        run: |
          version=$(npm --version)
          echo "npm $version"
          if [ "$(printf '11.5.0\n%s\n' "$version" | sort -V | head -n1)" != "11.5.0" ]; then
            echo "npm >= 11.5 is required for trusted publishing." >&2
            exit 1
          fi

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Validate release
        id: release
        run: node scripts/validate-release.mjs
        working-directory: cli

      - name: Publish
        id: publish
        run: npm publish --tag=latest --access=public --provenance --fetch-retries=0 --fetch-timeout=30000
        working-directory: cli

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          VALIDATE: ${{ steps.release.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          SHA: ${{ github.sha }}
        run: |
          case "$PUBLISH" in
            success) outcome="Published" ;;
            failure) outcome="Publish failed" ;;
            cancelled) outcome="Cancelled" ;;
            *)
              case "$VALIDATE" in
                failure) outcome="Not published: release validation failed" ;;
                *) outcome="Not published: an earlier step failed or the run was cancelled" ;;
              esac ;;
          esac
          {
            printf "### Publish\n\n"
            printf "| | |\n|---|---|\n"
            printf "| Package | @pbuilder/domainrings |\n"
            printf "| Version | %s |\n" "${VERSION:-unknown}"
            printf "| SHA | %s |\n" "$SHA"
            printf "| Outcome | %s |\n" "$outcome"
          } >> "$GITHUB_STEP_SUMMARY"
